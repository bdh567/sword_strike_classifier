<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple BLE Display</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; padding-top: 20vh; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #00adb5; color: white; border: none; border-radius: 5px; }
        #prediction { font-size: 4rem; color: #00adb5; font-weight: bold; margin-top: 40px; }
    </style>
</head>
<body>

    <button id="connect-btn">Connect Bluetooth</button>
    <p id="prediction">OFFLINE</p>

    <script>
        const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
        const PREDICTION_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

        document.getElementById('connect-btn').addEventListener('click', async () => {
            const display = document.getElementById('prediction');
            try {
                display.innerText = "CONNECTING...";
                
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });
                
                console.log("Device selected. Connecting to GATT server...");
                const server = await device.gatt.connect();
                
                console.log("Locating primary service layer...");
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                console.log("Binding data characteristic tracking channels...");
                const characteristic = await service.getCharacteristic(PREDICTION_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    display.innerText = new TextDecoder().decode(e.target.value).trim().toUpperCase();
                });

                display.innerText = "READY / IDLE";
            } catch (err) {
                display.innerText = "ERROR / TIMEOUT";
                console.error(err);
            }
        });
    </script>
</body>
</html>
